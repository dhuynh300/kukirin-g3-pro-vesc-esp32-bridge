name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Project checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: LispBM brackets
        run: python tools/check_lisp_parens.py
      - name: Shared constants
        run: python tools/check_shared_constants.py
      - name: Project rules
        run: python tools/lint_invariants.py

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      - name: Native tests
        run: pio test -e native

  build:
    name: Firmware build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # build_version.h takes the version from git describe, which needs the tags
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            .cache
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      - name: Bridge firmware
        run: pio run -e esp-wrover-kit
      - name: Display verification firmware
        run: pio run -e display-verify

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
