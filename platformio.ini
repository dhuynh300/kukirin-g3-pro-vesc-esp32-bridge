; Kukirin G3 Pro bridge firmware for the ESP32-WROVER

[platformio]
build_cache_dir = .cache
default_envs = esp-wrover-kit

[env:esp-wrover-kit]
platform = espressif32 @ 7.0.1
; The hardware is an ESP32-WROVER-IE DevKitC; this board definition is for the same WROVER module family
board = esp-wrover-kit
framework = arduino
lib_ldf_mode = deep+
extra_scripts = pre:scripts/build_timestamp.py

monitor_rts = 0
monitor_dtr = 0
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv

build_flags =
    -D BOARD_HAS_PSRAM
    -O2
    -std=gnu++17

build_unflags =
    -std=gnu++11

; Unit tests on the PC: pio test -e native (needs a host gcc on PATH).
; test/support provides minimal Arduino/FreeRTOS stand-ins, so the libraries are tested unchanged.
[env:native]
platform = native
test_framework = unity
lib_ldf_mode = deep+
lib_ignore = BTAudio
build_flags =
    -std=gnu++17
    -I test/support
    -Wall

; Bench build: display verification firmware (src/display_verify.cpp) driven by tools/display_verify.py.
; Replaces the bridge application; VESC link off, killswitch output held low.
[env:display-verify]
extends = env:esp-wrover-kit
build_src_filter = +<*> -<main.cpp>
build_flags =
    ${env:esp-wrover-kit.build_flags}
    -D KUKIRIN_DISPLAY_VERIFY
